[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kube-lookout"
version = "2.0.0"
description = "Kubernetes deployment watcher that posts updates to Slack"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "kubernetes>=29.0.0",
    "slack_sdk>=3.27.2",
    "slack>=0.0.2",
]

[project.scripts]
kube-lookout = "kube_lookout.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
